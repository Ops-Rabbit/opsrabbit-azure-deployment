apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsrabbit.fullname" . }}-backend
spec:
  podSelector:
    matchLabels:
      {{- include "opsrabbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "opsrabbit.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports:
        - port: 8384
          protocol: TCP
