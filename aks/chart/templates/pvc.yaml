{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- if not .Values.persistence.storageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "opsrabbit.fullname" . }}-{{ .Release.Namespace }}-retain
  annotations:
    helm.sh/resource-policy: keep
provisioner: disk.csi.azure.com
parameters:
  skuName: StandardSSD_LRS
  fsType: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opsrabbit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "opsrabbit.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ default (printf "%s-%s-retain" (include "opsrabbit.fullname" .) .Release.Namespace) .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
